<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cube Rush</title>
<style>
html,body{margin:0;height:100%;background:#0b0b1a;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
</style></head><body><canvas id="c"></canvas>
<script>
const G=64,JV=16,PV=22,FR=1/120;
const LV=[
{n:"Premiers pas",v:9,len:140,bg:["#13235e","#2f7bff"],ac:"#8be9ff",gr:"#0a1238",it:"s@16 s@23:2 b@30:3 s@38:3 g@47:2 s@55 s@59 s@63:2 b@70:4 s@77:2 p@85 s@88:2 b@100:2 s@104:3 g@113:3 s@121 s@124:2 s@130"},
{n:"Rythme infernal",v:10.2,len:190,bg:["#3a0b52","#ff4f9a"],ac:"#ffd1f0",gr:"#1d0830",it:"s@16 s@22 s@28:2 b@35:3 s@44 s@50:2 g@57:2 s@64 b@70:3 s@75:2 g@84:6 o@86:1:1 s@96 s@102:2 p@110 s@113:2 b@120:2 s@125 g@132:3 s@140 s@146:2 b@152:3 s@158 s@164:3 g@172:3 s@178"},
{n:"Vertige",v:11.5,len:215,bg:["#3a0a0a","#ff7a1a"],ac:"#ffe0a0",gr:"#1a0606",it:"s@16:2 s@23 s@29:3 b@37:3 s@46:2 s@53 p@60 s@63:3 g@71:3 s@79 b@86:2 s@89 s@95:2 g@103:7 o@105:1:1 s@116 s@122:2 b@130:4 s@137:2 s@144 p@151 s@154:2 s@160 g@167:4 s@175:3 s@182 s@188:2 b@195:3 s@202:2"},
{n:"La limite humaine",v:12.5,len:252,bg:["#050505","#7a0000"],ac:"#ff3b3b",gr:"#0d0000",it:"s@16:2 s@25 s@33:3 b@42:3 s@52:2 s@60 g@69:3 s@78 b@86:3 s@96:2 p@104 s@108:2 s@117 g@126:6 o@128:1:1 s@138 s@146:2 b@155:3 s@165 s@172:2 g@181:3 s@190 p@197 s@201:3 s@211 g@220:7 o@222:1:1 s@232 s@240:2"},
{n:"War Horse",v:13,len:230,bg:["#1a1200","#c78a00"],ac:"#ffd24a",gr:"#120c00",it:"s@16 s@24 s@32:2 g@42:7 s@58 s@66:2 b@74:3 s@82 g@94:7 s@110 s@118:2 p@126 s@130:2 g@142:7 s@158 s@165:2 b@173:3 s@181:2 g@193:7 s@209 s@216"}
];
function build(L){
const cs={},at=c=>cs[c]||(cs[c]={b:[],s:[],p:[],o:[]});L.gp=new Set();let id=0;
for(const t of L.it.split(" ")){const[k,r]=t.split("@"),[c,n=1,h]=r.split(":").map(Number);
for(let i=0;i<n;i++){const x=c+i;
if(k=="s")at(x).s.push({x,y:h||0});
else if(k=="b")for(let j=0;j<(h||1);j++)at(x).b.push({x,y:j});
else if(k=="f")at(x).b.push({x,y:h});
else if(k=="g")L.gp.add(x);
else if(k=="p")at(x).p.push({x,y:0});
else if(k=="o"&&i==0)at(x).o.push({x,y:h,id:++id})}}
L.cs=cs}
const hg=(L,c)=>!L.gp.has(c);
function mk(){return{x:0,y:0,vy:0,gr:1,h:0,ou:0,dead:0,won:0}}
function step(S,L,held){
const pr=held&&!S.h;S.h=held?1:0;const fx=Math.floor(S.x);
if(S.gr&&held){S.vy=JV;S.gr=0}
else if(pr&&!S.gr)for(let c=fx-1;c<=fx+2;c++){const q=L.cs[c];if(q)for(const o of q.o){const dx=o.x-S.x,dy=o.y-S.y;if(dx*dx+dy*dy<.8&&S.ou!=o.id){S.vy=JV;S.ou=o.id}}}
S.x+=L.v*FR;S.vy-=G*FR;S.y+=S.vy*FR;S.gr=0;
const x0=Math.floor(S.x),e=.04;
for(let c=x0-1;c<=x0+1;c++){const q=L.cs[c];if(!q)continue;
for(const b of q.b)if(S.x+1-e>b.x&&S.x+e<b.x+1&&S.y+1-e>b.y&&S.y+e<b.y+1){if(S.vy<=0&&S.y>=b.y+1-.22){S.y=b.y+1;S.vy=0;S.gr=1}else{S.dead=1;return}}
for(const s of q.s)if(S.x+.9>s.x+.3&&S.x+.1<s.x+.7&&S.y+.9>s.y&&S.y+.1<s.y+.5){S.dead=1;return}
for(const p of q.p)if(S.vy<=0&&S.x+1>p.x&&S.x<p.x+1&&S.y<p.y+.3){S.vy=PV;S.gr=0}}
const a=hg(L,Math.floor(S.x+.15)),b=hg(L,Math.floor(S.x+.85));
if(S.y<=0&&S.vy<=0&&S.y>-.25&&(a||b)){S.y=0;S.vy=0;S.gr=1}
else if(S.y<=-.25&&(hg(L,Math.floor(S.x+.1))||hg(L,Math.floor(S.x+.9)))){S.dead=1;return}
if(S.y<-6){S.dead=1;return}
if(S.x>=L.len)S.won=1}
const cv=document.getElementById("c"),g=cv.getContext("2d");
let W,H,T,gY,lv=0,st=0,S=mk(),held=0,att=1,t=0,acc=0,rot=0,dT=0,parts=[],ui=[],best=[0,0,0,0,0];
try{const b=JSON.parse(localStorage.getItem("cr_best"));if(Array.isArray(b)&&b.length==5)best=b}catch(e){}
const save=()=>{try{localStorage.setItem("cr_best",JSON.stringify(best))}catch(e){}};
LV.forEach(build);
const fn=n=>{const x=Math.sin(n*127.1)*43758.5453;return x-Math.floor(x)};
const pct=()=>Math.min(100,Math.floor(S.x/LV[lv].len*100));
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);T=Math.min(H/8.5,W/13);gY=Math.min(H*.5+2.5*T,H*.86)}
addEventListener("resize",rs);rs();
function start(i){lv=i;S=mk();att=1;st=1;parts=[];rot=0}
function menu(){st=0;held=0}
function die(){st=2;dT=.75;for(let i=0;i<20;i++)parts.push({x:S.x+.5,y:S.y+.5,vx:(Math.random()-.5)*9,vy:Math.random()*8-1,l:1});const p=pct();if(p>best[lv]){best[lv]=p;save()}}
function win(){st=3;best[lv]=100;save()}
function hit(e){for(const u of ui)if(e.clientX>=u.x&&e.clientX<=u.x+u.w&&e.clientY>=u.y&&e.clientY<=u.y+u.h){u.f();return 1}return 0}
cv.addEventListener("pointerdown",e=>{e.preventDefault();if(hit(e))return;if(st==1)held=1});
addEventListener("pointerup",()=>held=0);addEventListener("pointercancel",()=>held=0);addEventListener("blur",()=>held=0);
const isJ=k=>k==" "||k=="ArrowUp"||k.toLowerCase()=="w";
addEventListener("keydown",e=>{const k=e.key;if(isJ(k)){e.preventDefault();held=1}else if(k=="Escape")menu();else if(st==0&&/^[1-5]$/.test(k))start(+k-1);else if(st==3&&k=="Enter")start(lv<LV.length-1?lv+1:lv)});
addEventListener("keyup",e=>{if(isJ(e.key))held=0});
function rr(x,y,w,h,r){g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h)}
function txt(s,x,y,sz,col,al){g.font=`700 ${sz}px system-ui,sans-serif`;g.fillStyle=col||"#fff";g.textAlign=al||"center";g.textBaseline="middle";g.fillText(s,x,y)}
function btn(s,x,y,w,h,f,col){rr(x,y,w,h,12);g.fillStyle=col||"rgba(255,255,255,.18)";g.fill();g.strokeStyle="rgba(255,255,255,.6)";g.lineWidth=2;g.stroke();txt(s,x+w/2,y+h/2,Math.min(h*.42,26));ui.push({x,y,w,h,f})}
function world(cam,L){
const sx=x=>(x-cam)*T,c0=Math.floor(cam)-1,c1=Math.ceil(cam+W/T)+1;
const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,L.bg[0]);gr.addColorStop(1,L.bg[1]);g.fillStyle=gr;g.fillRect(0,0,W,H);
const b=Math.floor(cam*.3/4.1);g.fillStyle="rgba(255,255,255,.07)";
for(let k=-1;k<W/(4.1*T)+2;k++){const i=k+b,h=(1.5+fn(i)*4)*T;g.fillRect((i*4.1-cam*.3)*T,gY-h,T*2.2,h)}
g.fillStyle="#04050d";g.fillRect(0,gY,W,H-gY);
for(let c=c0;c<=c1;c++){if(L.gp.has(c))continue;g.fillStyle=L.gr;g.fillRect(sx(c),gY,T+1,H-gY);g.fillStyle=L.ac;g.fillRect(sx(c),gY,T+1,3)}
for(let c=c0;c<=c1;c++){const q=L.cs[c];if(!q)continue;
for(const o of q.b){const x=sx(o.x),y=gY-(o.y+1)*T;g.fillStyle=L.gr;g.fillRect(x,y,T+1,T+1);g.strokeStyle=L.ac;g.lineWidth=2;g.strokeRect(x+1,y+1,T-2,T-2);g.strokeStyle=L.ac+"66";g.strokeRect(x+T*.28,y+T*.28,T*.44,T*.44)}
for(const o of q.s){const x=sx(o.x),y=gY-o.y*T;g.fillStyle="#05050c";g.strokeStyle=L.ac;g.lineWidth=2;g.beginPath();g.moveTo(x+T*.08,y);g.lineTo(x+T*.5,y-T*.85);g.lineTo(x+T*.92,y);g.closePath();g.fill();g.stroke()}
for(const o of q.p){g.fillStyle="#ffe14a";g.fillRect(sx(o.x)+T*.1,gY-T*.2,T*.8,T*.2)}
for(const o of q.o){const x=sx(o.x)+T/2,y=gY-(o.y+.5)*T;g.fillStyle="rgba(255,225,74,.3)";g.beginPath();g.arc(x,y,T*.32,0,7);g.fill();g.strokeStyle="#ffe14a";g.lineWidth=4;g.stroke()}}
g.fillStyle=L.ac+"88";g.fillRect(sx(L.len),0,T*.4,gY)}
function player(cam){
const x=(S.x-cam)*T+T/2,y=gY-(S.y+.5)*T;g.save();g.translate(x,y);g.rotate(rot);
g.fillStyle="#ffd23f";g.fillRect(-T/2,-T/2,T,T);g.strokeStyle="#111";g.lineWidth=3;g.strokeRect(-T/2,-T/2,T,T);
g.fillStyle="#111";g.fillRect(-T*.28,-T*.2,T*.16,T*.16);g.fillRect(T*.12,-T*.2,T*.16,T*.16);g.fillRect(-T*.25,T*.15,T*.5,T*.1);g.restore()}
function draw(){
ui=[];const L=LV[lv],cam=st==0?(t*5)%60:S.x-3.5;
world(cam,L);
if(st==0){
g.fillStyle="rgba(5,5,20,.55)";g.fillRect(0,0,W,H);
txt("CUBE RUSH",W/2,H*.1,Math.min(W/9,H*.1,64),"#ffd23f");
txt("Touche l'écran ou maintiens Espace pour sauter",W/2,H*.18,Math.min(W/26,H*.045,20),"#d6d9ff");
const w=Math.min(W*.86,560),h=Math.max(40,Math.min(H*.12,80));
LV.forEach((l,i)=>{const x=(W-w)/2,y=H*.25+i*(h+8);
rr(x,y,w,h,14);const gr=g.createLinearGradient(x,0,x+w,0);gr.addColorStop(0,l.bg[0]);gr.addColorStop(1,l.bg[1]);g.fillStyle=gr;g.fill();g.strokeStyle=l.ac;g.lineWidth=2;g.stroke();
txt((i+1)+". "+l.n,x+18,y+h*.38,Math.min(h*.36,24),"#fff","left");
txt("Record : "+best[i]+" %",x+18,y+h*.72,Math.min(h*.26,17),l.ac,"left");
ui.push({x,y,w,h,f:()=>start(i)})});
return}
if(st!=2)player(cam);
for(const p of parts){g.fillStyle=L.ac;g.globalAlpha=Math.max(0,p.l);g.fillRect((p.x-cam)*T,gY-p.y*T,T*.22,T*.22)}
g.globalAlpha=1;
const pw=Math.min(W*.5,360),p0=(W-pw)/2;g.fillStyle="rgba(0,0,0,.4)";g.fillRect(p0,14,pw,10);g.fillStyle=L.ac;g.fillRect(p0,14,pw*Math.min(1,S.x/L.len),10);
txt(pct()+" %",W/2,40,16);
txt("Tentative "+att,(3-cam)*T,gY-4*T,Math.max(16,T*.7),"#fff");
if(st==1||st==2)btn("Menu",W-84,10,72,34,menu);
if(st==3){
g.fillStyle="rgba(5,5,20,.65)";g.fillRect(0,0,W,H);
txt("Niveau terminé !",W/2,H*.25,Math.min(W/10,54),"#ffd23f");
txt("Tentatives : "+att,W/2,H*.35,Math.min(W/24,22));
const w=Math.min(W*.7,320),h=52,x=(W-w)/2;let y=H*.45;
btn("Rejouer",x,y,w,h,()=>start(lv));y+=h+12;
if(lv<LV.length-1){btn("Niveau suivant",x,y,w,h,()=>start(lv+1));y+=h+12}
btn("Menu",x,y,w,h,menu)}}
let last=0;
function loop(ts){
const dt=Math.min(.05,(ts-last)/1000||0);last=ts;t+=dt;const L=LV[lv];
if(st==1){acc+=dt;while(acc>=FR&&st==1){step(S,L,held);acc-=FR;if(S.dead)die();else if(S.won)win()}
if(S.gr){const tg=Math.round(rot/(Math.PI/2))*Math.PI/2;rot+=(tg-rot)*Math.min(1,dt*20)}else rot+=dt*6.3}
else if(st==2){dT-=dt;if(dT<=0){S=mk();att++;st=1;rot=0;acc=0}}
for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy-=25*dt;p.l-=dt*1.2}
parts=parts.filter(p=>p.l>0);
draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
