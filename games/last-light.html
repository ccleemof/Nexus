<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dernière Lumière V1</title>
<style>
:root{--bg:#12141c;--fg:#e8ecff;--acc:#ffd27a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Georgia,serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;padding:10px 14px;pointer-events:none}
#bars{height:10px;background:#ffffff22;border-radius:5px;overflow:hidden}
#xp{height:100%;width:0;background:#6aa7ff}
#row{display:flex;justify-content:space-between;margin-top:6px;font-size:18px}
#hp{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:160px;height:10px;background:#ffffff22;border-radius:5px;overflow:hidden;pointer-events:none}
#hpf{height:100%;width:100%;background:#ff5d73}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;background:#12141ccc}
#ov h1{font-size:48px;font-weight:400;margin:0}
#ov p{margin:0;opacity:.75;max-width:32ch;line-height:1.5}
.b{font:inherit;font-size:18px;padding:12px 22px;border-radius:14px;border:2px solid var(--acc);background:#12141c;color:var(--acc);cursor:pointer;width:min(320px,86vw);text-align:left}
.b small{display:block;color:var(--fg);opacity:.7;font-size:14px;margin-top:2px}
.b:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.hide{display:none!important}
#bh{position:fixed;top:calc(54px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(420px,86vw);text-align:center;pointer-events:none;font-size:15px;letter-spacing:.08em}
#bb{height:12px;background:#ffffff22;border-radius:6px;overflow:hidden;margin-top:3px}
#bf{height:100%;width:100%;background:#ff2a6d}
#cb{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;width:44px;height:44px;border-radius:50%;border:2px solid #ffffff55;background:#12141ccc;color:var(--fg);font-size:20px;cursor:pointer}
#cp{position:fixed;right:12px;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;flex-direction:column;gap:6px;background:#12141cee;border:1px solid #ffffff33;border-radius:12px;padding:10px;max-height:60vh;overflow-y:auto;touch-action:pan-y}
#cp button{font:inherit;font-size:15px;padding:8px 12px;border-radius:8px;border:1px solid var(--acc);background:transparent;color:var(--acc);cursor:pointer;text-align:left}
#cp button:focus-visible,#cb:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
#fx *{position:absolute}
.fl{inset:0;background:#fff;animation:fl .7s ease-out forwards}
.sl{left:50%;top:50%;width:260vmax;height:260vmax;margin:-130vmax 0 0 -130vmax;background:repeating-conic-gradient(var(--c) 0 1.2deg,transparent 1.2deg 5deg);-webkit-mask:radial-gradient(circle,transparent 8%,#000 40%);mask:radial-gradient(circle,transparent 8%,#000 40%);animation:sl 1.6s cubic-bezier(.1,.7,.2,1) forwards}
.rg{left:50%;top:50%;width:20px;height:20px;margin:-10px;border-radius:50%;border:6px solid var(--c);animation:rg 1s ease-out forwards}
.kj{left:0;right:0;top:50%;text-align:center;font:900 38vmin/1 "Arial Black",Impact,sans-serif;color:transparent;-webkit-text-stroke:2px var(--c);transform:translateY(-50%);opacity:0;animation:kj 1.8s ease-out forwards}
.bd{left:-10%;right:-10%;top:50%;height:130px;margin-top:-65px;background:var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;animation:bd 1.9s cubic-bezier(.2,1.2,.3,1) forwards;box-shadow:0 0 60px var(--c)}
.bd b{position:static;font:900 italic 40px/1 "Arial Black",Impact,sans-serif;color:#fff;text-shadow:3px 3px 0 #12141c;letter-spacing:.03em}
.bd i{position:static;font:italic 18px Georgia,serif;color:#12141c;margin-top:6px}
@keyframes fl{to{opacity:0}}
@keyframes sl{0%{transform:scale(.2) rotate(0);opacity:1}100%{transform:scale(1) rotate(20deg);opacity:0}}
@keyframes rg{0%{transform:scale(1);opacity:1}100%{transform:scale(90);opacity:0;border-width:1px}}
@keyframes kj{0%{opacity:0;transform:translateY(-50%) scale(1.6)}20%{opacity:.7}100%{opacity:0;transform:translateY(-50%) scale(1)}}
@keyframes bd{0%{transform:translateX(-120%) rotate(-6deg)}18%{transform:translateX(0) rotate(-6deg)}78%{transform:translateX(0) rotate(-6deg);opacity:1}100%{transform:translateX(120%) rotate(-6deg);opacity:0}}
#ch{max-height:58vh;overflow-y:auto;touch-action:pan-y;padding:4px}
.op{animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 22px currentColor}}
#cs{position:fixed;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.lb{position:absolute;left:0;right:0;height:0;background:#000;animation:lb .8s ease-out forwards}
.lb.t{top:0}.lb.b{bottom:0}
.lb.o{height:13vh;animation:lbo .9s ease-in forwards}
.vg{position:absolute;inset:0;background:radial-gradient(circle,transparent 30%,#8b0000d0 100%);animation:hb .75s ease-in-out infinite}
.cx{position:absolute;left:0;right:0;top:50%;text-align:center;font:italic 30px/1.2 Georgia,serif;letter-spacing:.2em;color:#fff;opacity:0;animation:cx 1.4s ease-out forwards}
.cx.r{color:#ffb347;font:900 italic 64px/1 "Arial Black",Impact,sans-serif;letter-spacing:.05em;text-shadow:0 0 30px #ff7a1a,3px 3px 0 #12141c;animation:cr 1.4s ease-out forwards}
@keyframes lb{to{height:13vh}}
@keyframes lbo{to{height:0}}
@keyframes hb{50%{opacity:.35}}
@keyframes cx{0%{opacity:0;transform:translateY(-50%) scale(1.2)}40%{opacity:1}100%{opacity:.8;transform:translateY(-50%) scale(1)}}
@keyframes cr{0%{opacity:0;transform:translateY(-50%) scale(.4)}60%{opacity:1;transform:translateY(-50%) scale(1.15)}100%{opacity:1;transform:translateY(-50%) scale(1)}}
@media (prefers-reduced-motion:reduce){.sl,.rg,.kj{display:none}.op{animation:none}.vg{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div id="bars"><div id="xp"></div></div><div id="row"><span id="lv">Niv. 1</span><span id="tm">0:00</span><span id="kl">0 morts</span></div></div>
<div id="bh" class="hide"><span id="bn"></span><div id="bb"><div id="bf"></div></div></div><div id="hp"><div id="hpf"></div></div>
<button id="cb" aria-label="Triches">⚙</button><div id="cp" class="hide"></div>
<div id="cs"></div><div id="fx"></div>
<div id="ov"><h1 id="t">Dernière Lumière V1</h1><p id="d">Glissez n'importe où pour bouger (ou ZQSD). Vous tirez automatiquement. Collectez les gemmes bleues pour monter de niveau.</p><div id="ch"></div><button class="b" id="go" style="text-align:center">Commencer</button><button class="b" id="sb" style="text-align:center">Boutique</button></div>
<script>
const cv=document.getElementById("c"),x=cv.getContext("2d"),$=i=>document.getElementById(i);
let W,H,dpr;
function fit(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
addEventListener("resize",fit);fit();
const keys={};addEventListener("keydown",e=>keys[e.key.toLowerCase()]=1);addEventListener("keyup",e=>keys[e.key.toLowerCase()]=0);
let joy=null;
addEventListener("pointerdown",e=>{if(e.target.closest("button"))return;joy={ox:e.clientX,oy:e.clientY,x:e.clientX,y:e.clientY}});
addEventListener("pointermove",e=>{if(joy){joy.x=e.clientX;joy.y=e.clientY}});
addEventListener("pointerup",()=>joy=null);addEventListener("pointercancel",()=>joy=null);
const UP=[
{n:"Balles plus tranchantes",d:"+30% de dégâts",f:p=>p.dmg*=1.3},
{n:"Détente rapide",d:"+25% de cadence de tir",f:p=>p.rate*=1.25},
{n:"Canon supplémentaire",d:"+1 projectile",f:p=>p.multi++},
{n:"Pieds légers",d:"+15% de vitesse de déplacement",f:p=>p.sp*=1.15},
{n:"Peau épaisse",d:"+25 PV max, soigne 25",f:p=>{p.max+=25;p.hp=Math.min(p.max,p.hp+25)}},
{n:"Aimant",d:"+60% de portée de ramassage",f:p=>p.mag*=1.6}
];
const UC=["#ff5d73","#ffd27a","#b36dff","#7de3d0","#6aa7ff","#ff9d5d"],KJ=["覚醒","神速","進化","解放","不屈","吸引"];
UP.forEach((u,i)=>{u.c=UC[i];u.k=KJ[i]});
function epic(u){
const c='style="--c:'+u.c+'"';
$("fx").innerHTML='<div class="fl"></div><div class="sl" '+c+'></div><div class="rg" '+c+'></div><div class="kj" '+c+'>'+u.k+'</div><div class="bd" '+c+'><b>'+u.n.toUpperCase()+'!</b><i>'+u.d+'</i></div>'+(u.op?'<div class="sl" style="--c:#fff;animation-duration:2.6s"></div><div class="rg" style="--c:#fff;animation-duration:1.6s"></div>':'');
clearTimeout(epic.t);epic.t=setTimeout(()=>$("fx").innerHTML="",u.op?3000:2000);
for(let i=0;i<(u.op?320:90);i++){const a=Math.random()*6.283,v=100+Math.random()*500;pt.push({x:p.x,y:p.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c:u.c})}
sh=u.op?70:30;slow=u.op?1.6:.9;if(navigator.vibrate)navigator.vibrate([30,40,60])}
const IT=[
{id:"hp",n:"Cœur de fer",d:"+30 PV max",g:100,c:"#ff5d73",k:"鉄心",f:p=>{p.max+=30;p.hp=p.max}},
{id:"sp",n:"Bottes du vent",d:"+12% de vitesse de déplacement",g:120,c:"#7de3d0",k:"疾風",f:p=>p.sp*=1.12},
{id:"mg",n:"Anneau aimant",d:"+50% de portée de ramassage",g:120,c:"#6aa7ff",k:"磁力",f:p=>p.mag*=1.5},
{id:"rt",n:"Détente sensible",d:"+20% de cadence de tir",g:150,c:"#ffd27a",k:"連射",f:p=>p.rate*=1.2},
{id:"tw",n:"Double canon",d:"+1 projectile",g:400,c:"#b36dff",k:"双銃",f:p=>p.multi++},
{id:"hv",op:1,n:"Perceur céleste",d:"Les balles percent tout, +3 projectiles, x2,5 dégâts",g:3000,s:3,c:"#ff2bd6",k:"天穿",f:p=>{p.pierce=1;p.multi+=3;p.dmg*=2.5}},
{id:"ph",op:1,n:"Noyau du phénix",d:"Réanime une fois par partie avec une explosion, +100 PV max",g:5000,s:5,c:"#ff7a1a",k:"鳳凰",f:p=>{p.rev=1;p.max+=100;p.hp=p.max}},
{id:"vf",n:"Croc vampirique",d:"Soigne 1 PV par élimination",g:600,c:"#ff4d6d",k:"吸血",f:p=>p.ls=(p.ls||0)+1},
{id:"mh",n:"Main de Midas",d:"Double l'or des butins",g:700,c:"#ffd24a",k:"黄金",f:p=>p.gm=2},
{id:"tp",op:1,n:"Plaque de titan",d:"+150 PV max et subit 30% de dégâts en moins",g:4000,s:3,c:"#9aa7ff",k:"鉄壁",f:p=>{p.max+=150;p.hp=p.max;p.dr=.3}},
{id:"ch",op:1,n:"Montre de Chronos",d:"Les ennemis et leurs projectiles sont 35% plus lents",g:5000,s:4,c:"#4dd2ff",k:"時止",f:p=>p.sl=.35},
{id:"sf",op:1,n:"Cœur de forge stellaire",d:"+2 projectiles, +60% de cadence, x2 dégâts",g:6500,s:6,c:"#ffe14d",k:"星核",f:p=>{p.multi+=2;p.rate*=1.6;p.dmg*=2}}
];
let sv={gold:0,sh:0,own:[],eq:"gun"};
try{const j=JSON.parse(localStorage.getItem("ll-save"));if(j)sv={gold:j.gold|0,sh:j.sh|0,own:Array.isArray(j.own)?j.own:[],eq:j.eq}}catch(e){}
function save(){try{localStorage.setItem("ll-save",JSON.stringify(sv))}catch(e){}}
function drop(e){if(p.ls)p.hp=Math.min(p.max,p.hp+p.ls);if(e.ty=="spl")for(let i=0;i<3;i++)mkEnemy(e.x+Math.cos(i*2.1)*20,e.y+Math.sin(i*2.1)*20);if(e.b){for(let i=0;i<(e.ty=="deity"?12:e.ty=="drag"?6:e.ty=="over"?4:2);i++)gm.push({x:e.x+i*14-20,y:e.y+20,v:1,k:"s"});for(let i=0;i<(e.ty=="deity"?40:8);i++)gm.push({x:e.x+Math.cos(i)*(40+i*3),y:e.y+Math.sin(i)*(40+i*3),v:e.ty=="deity"?150:40,k:"g"});epic({c:"#ffd27a",k:e.ty=="deity"?"神殺":"撃破",n:"Victoire",d:e.nm+" vaincu",op:1});return}if(Math.random()<.5)gm.push({x:e.x+8,y:e.y,v:e.r>15?25:3,k:"g"});if(e.r>15&&Math.random()<.08)gm.push({x:e.x-8,y:e.y,v:1,k:"s"})}
function menu(){$("ch").innerHTML="";$("t").textContent=msgT;$("d").textContent=msgD;$("go").classList.remove("hide");$("sb").classList.remove("hide")}
const WP=[
{id:"gun",free:1,n:"Pistolet auto",d:"Tire sur l'ennemi le plus proche",g:0,c:"#ffd27a",k:"銃"},
{id:"orb",n:"Lames orbitales",d:"Des lames tournent autour de vous, +1 par amélioration de projectiles. Faible mais constant",g:250,c:"#7de3d0",k:"旋刃"},
{id:"lit",n:"Foudre en chaîne",d:"Frappe l'ennemi le plus proche et rebondit dans la foule",g:800,c:"#6aa7ff",k:"雷鳴"},
{id:"met",op:1,n:"Tempête de météores",d:"Des boules de feu tombent du ciel et explosent en de vastes déflagrations",g:2500,s:2,c:"#ff7a1a",k:"流星"},
{id:"bem",op:1,n:"Faisceau du jugement",d:"D'immenses faisceaux de lumière tournoyants effacent tout sur leur passage",g:4500,s:4,c:"#fff36b",k:"裁光"},
{id:"nov",n:"Nova de givre",d:"Émet une onde de choc qui inflige des dégâts et repousse les ennemis",g:900,c:"#9ad8ff",k:"氷輪"},
{id:"slh",op:1,n:"Dix mille taillades",d:"Fait pleuvoir des lignes de coupe anime sur le champ de bataille",g:3500,s:3,c:"#ff4fa3",k:"剣嵐"},
{id:"drg",op:1,n:"Souffle du dragon",d:"Un cône de feu rugissant qui fond les foules",g:5000,s:4,c:"#ff4500",k:"竜炎"},
{id:"blk",op:1,n:"Trou noir",d:"Aspire la horde dans une singularité, puis la fait exploser",g:7500,s:6,c:"#b05cff",k:"虚無"},
{id:"wrm",op:1,n:"Trou de ver",d:"Ouvre une paire de portails : les ennemis sont aspirés par l'un et projetés par l'autre",g:9000,s:7,c:"#58c8ff",k:"時空"}
];
function phoenix(){
cut=1;const c=$("cs");
c.innerHTML='<div class="lb t"></div><div class="lb b"></div><div class="vg"></div><div class="cx">pas encore…</div>';
cv.style.transition="transform 1.6s ease-in,filter .6s";cv.style.filter="grayscale(1) brightness(.7)";cv.style.transform="scale(1.3)";
if(navigator.vibrate)navigator.vibrate([70,110,70,400]);
setTimeout(()=>{
c.innerHTML='<div class="lb t"></div><div class="lb b"></div><div class="cx r">RELÈVE-TOI.</div>';
cv.style.transition="transform 1.2s ease-in,filter .3s";cv.style.filter="sepia(1) saturate(4) hue-rotate(-20deg) brightness(1.1)";cv.style.transform="scale(1.45)";
for(let i=0;i<180;i++){const a=Math.random()*6.283,d=170+Math.random()*80;pt.push({x:p.x+Math.cos(a)*d,y:p.y+Math.sin(a)*d,vx:-Math.cos(a)*d*2.6,vy:-Math.sin(a)*d*2.6,l:1.1,c:Math.random()<.5?"#ff9d3a":"#ffd27a"})}
},1500);
setTimeout(()=>{
c.innerHTML='<div class="lb o t"></div><div class="lb o b"></div>';
cv.style.transition="transform .45s cubic-bezier(.2,1.6,.4,1),filter .4s";cv.style.filter="";cv.style.transform="";
p.hp=p.max;p.inv=2.5;
en.forEach(q=>{if((q.x-p.x)**2+(q.y-p.y)**2<460*460&&!q.b){q.hp=0;kills++;gm.push({x:q.x,y:q.y,v:1});drop(q)}});
epic(IT.find(i=>i.id=="ph"));cut=0;hud();
setTimeout(()=>{c.innerHTML=""},1000)
},2900)}
function hitE(e,d){if(e.hp<=0||e.ghost)return;e.hp-=d;e.hit=.08;if(e.hp<=0){kills++;gm.push({x:e.x,y:e.y,v:e.r>15?4:1});drop(e)}}
function boom(o){for(const e of en)if((e.x-o.x)**2+(e.y-o.y)**2<((o.R||95)+e.r)**2)hitE(e,p.dmg*(o.dm||6));ex.push({k:"r",x:o.x,y:o.y,l:.5,m:.5,R:o.R});sh=Math.max(sh,22);for(let i=0;i<28;i++){const a=Math.random()*6.283,v=80+Math.random()*320;pt.push({x:o.x,y:o.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.9,c:"#ffb347"})}}
function wep(dt){
for(const e of en)e.ot-=dt;
for(const o of ex){o.l-=dt;if(o.k=="m"&&o.l<=0)boom(o);if(o.k=="dl"){o.a+=o.da*dt;if(o.m-o.l>.8){const ux=Math.cos(o.a),uy=Math.sin(o.a),dx=p.x-o.x,dy=p.y-o.y;if(dx*ux+dy*uy>0&&Math.abs(dx*uy-dy*ux)<20)hurt(28)}}
if(o.k=="dz"&&o.l<=0){ex.push({k:"r",x:o.x,y:o.y,l:.45,m:.45,R:o.R,c:"255,255,255"});if(Math.hypot(p.x-o.x,p.y-o.y)<o.R+8)hurt(38);sh=Math.max(sh,12)}
if(o.k=="wm"){for(const e of en){if(e.b)continue;const dx=o.x-e.x,dy=o.y-e.y,d=Math.hypot(dx,dy);if(d<280&&d>2){const f=1-d/280;e.x+=dx/d*420*f*dt;e.y+=dy/d*420*f*dt;if(d<150){e.sg=1-d/150;e.sa=Math.atan2(dy,dx)}}if(d<44){hitE(e,p.dmg*5);e.x=o.bx+(Math.random()-.5)*60;e.y=o.by+(Math.random()-.5)*60;for(let i=0;i<4;i++)pt.push({x:e.x,y:e.y,vx:(Math.random()-.5)*300,vy:(Math.random()-.5)*300,l:.6,c:"#8fd8ff"})}}}
if(o.k=="h"){o.tk-=dt;const tk=o.tk<=0;if(tk)o.tk=.15;for(const e of en){const dx=o.x-e.x,dy=o.y-e.y,d=Math.hypot(dx,dy);if(d<320&&d>4){const f=e.b?.2:1;e.x+=dx/d*170*f*dt;e.y+=dy/d*170*f*dt;if(tk&&d<260)hitE(e,p.dmg*1.2);e.ts=Math.min(e.ts||1,1-.85*(1-d/320));if(d<170){e.sg=1-d/170;e.sa=Math.atan2(dy,dx)}}}if(o.l<=0)boom({x:o.x,y:o.y,R:220,dm:12})}}
ex=ex.filter(o=>o.l>0);
if(eq=="orb"){wa+=dt*3.4;const n=2+p.multi;for(let i=0;i<n;i++){const a=wa+i*6.283/n,bx=p.x+Math.cos(a)*75,by=p.y+Math.sin(a)*75;for(const e of en)if(!(e.ot>0)&&(e.x-bx)**2+(e.y-by)**2<(e.r+10)**2){e.ot=.3;hitE(e,p.dmg*1.3)}}}
else if(eq=="lit"){lt-=dt;if(lt<=0){lt=1/(p.rate*.7);let c=near(),n=3+p.multi;const pts=[{x:p.x,y:p.y}],done=new Set;while(c&&n-->0){pts.push({x:c.x,y:c.y});done.add(c);hitE(c,p.dmg*4);let b=null,bd=170*170;for(const e of en)if(e.hp>0&&!done.has(e)){const d=(e.x-c.x)**2+(e.y-c.y)**2;if(d<bd){bd=d;b=e}}c=b}if(pts.length>1){ex.push({k:"b",pts,l:.3,m:.3});sh=Math.max(sh,6)}}}
